<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Property Empire — UMI Games</title>
<link rel="icon" href="/assets/icon-32.png" sizes="32x32">
<style>
:root{
  --bg:#080e19;--bg2:#0d1626;--panel:#111c31;--panel2:#16243d;--line:#243654;
  --ink:#eaf0ff;--muted:#8ea0c0;--gold:#f2c14e;--gold2:#ffd97a;
  --green:#35d07f;--red:#ef4b5a;--blue:#5aa9ff;--violet:#a78bfa;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --r:16px;
  --tile-name:clamp(6.4px,.92vw,10.4px);
  --tile-price:clamp(5.8px,.76vw,8.4px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(1200px 700px at 12% -8%,#1b2c4d 0%,transparent 60%),
    radial-gradient(900px 600px at 100% 0%,#231a3d 0%,transparent 55%),
    linear-gradient(180deg,#0a111e,#070b14 70%);
  color:var(--ink);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.42;cursor:not-allowed}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:.2px}
.mono{font-variant-numeric:tabular-nums}

/* ---------------- TOPBAR ---------------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:rgba(9,15,26,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2a3f68,#16233a);box-shadow:inset 0 0 0 1px #37507a,0 6px 16px rgba(0,0,0,.35)}
.brand b{font-size:15px;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase}
.topbar .spacer{flex:1}
.turn-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.turn-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(53,208,127,.18)}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;
  transition:.16s transform,.16s background,.16s border-color}
.tbtn:hover{background:var(--panel2);border-color:#35507c}
.tbtn:active{transform:translateY(1px)}
.tbtn.icon{width:38px;justify-content:center;padding:0;font-size:16px}
.tbtn.on{background:rgba(242,193,78,.14);border-color:rgba(242,193,78,.5);color:var(--gold2)}

/* ---------------- LAYOUT ---------------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:16px;padding:16px;max-width:1460px;margin:0 auto}
@media (max-width:1080px){.layout{grid-template-columns:1fr;padding:10px;gap:12px}.board-frame{width:100%}}

/* ---------------- BOARD ---------------- */
.board-col{min-width:0}
.board-frame{
  position:relative;width:min(100%,calc(74vh + 30px));margin:0 auto;border-radius:22px;padding:14px;
  background:
    linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,0) 42%),
    #16233a url('/assets/pieces/kayu-gelap.jpg') center/cover;
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.07);
  border:1px solid #2b3f60;
}
.board-wrap{overflow:hidden;border-radius:10px;touch-action:none;cursor:default}
.board-wrap.zoomed{cursor:grab}
.board{
  position:relative;width:100%;aspect-ratio:1;display:grid;
  grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));
  background:#dfe7dd url('/assets/pieces/tekstur-papan.jpg') center/cover;
  border-radius:8px;overflow:hidden;transform-origin:0 0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.16),transparent 55%)}

.tile{
  position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,#eef4ea,#dde6d9);
  border:1px solid rgba(15,35,25,.42);cursor:pointer;
  color:#14251c;transition:box-shadow .15s,filter .15s;
}
.tile:hover{filter:brightness(1.06);box-shadow:inset 0 0 0 2px rgba(242,193,78,.75)}
.tile.sel{box-shadow:inset 0 0 0 2.5px #c8881e;z-index:3}
.tile.owned::after{content:"";position:absolute;inset:0;border:2.5px solid var(--own,#35d07f);pointer-events:none;opacity:.9;z-index:2}
.tile.owned .nm{color:#0f2a1c}
.tile .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--own);z-index:3}
.tile.edge-bottom .stripe,.tile.edge-top .stripe{left:0;right:0;top:auto;bottom:0;width:auto;height:3px}
.tile.edge-bottom{grid-row:11}
.tile.edge-top{grid-row:1}
.tile.edge-left{grid-column:1}
.tile.edge-right{grid-column:11}
.tile .body{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:3px 3px 4px;gap:2px}
.tile.edge-bottom .body{padding-top:4px}
.tile .nm{font-size:var(--tile-name);font-weight:800;line-height:1.05;text-align:center;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal;word-break:normal;letter-spacing:-.15px;hyphens:none}
.tile .pr{font-size:var(--tile-price);text-align:center;color:#3c5245;font-weight:700;letter-spacing:.1px}
.tile .band{height:13%;min-height:7px;display:flex;align-items:center;justify-content:center;gap:2px}
.tile.edge-bottom .band{order:-1;border-bottom:1px solid rgba(0,0,0,.25)}
.tile.edge-top .band{order:9;border-top:1px solid rgba(0,0,0,.25)}
.tile.edge-left .band,.tile.edge-right .band{position:absolute;top:0;bottom:0;width:11%;height:auto;border:0;order:0}
.tile.edge-left .band{right:0;border-left:1px solid rgba(0,0,0,.25)}
.tile.edge-right .band{left:0;border-right:1px solid rgba(0,0,0,.25)}
.tile.edge-left .body{padding-right:13%}
.tile.edge-right .body{padding-left:13%}
.tile.edge-left .nm,.tile.edge-right .nm{font-size:calc(var(--tile-name)*.86)}
.tile.edge-left .band .houses,.tile.edge-right .band .houses{flex-direction:column;height:100%;justify-content:center}
.tile.edge-left .band .hh,.tile.edge-right .band .hh{width:4px;height:4px}
.tile.edge-left .band .hh.hotel,.tile.edge-right .band .hh.hotel{width:4px;height:11px}
.tile .ico{flex:1;display:grid;place-items:center;padding:1px 0;min-height:0;width:100%}
.tile .ico svg{width:64%;height:78%;max-width:34px;overflow:visible}
.tile:not(.corner) .ico{flex:0 0 auto;height:15px;padding:0}
.tile:not(.corner) .ico svg{width:15px;height:15px;max-width:none}
.tile.price-row{display:flex;align-items:center;justify-content:center;gap:3px}
.tile .owner-dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tile .houses{display:flex;gap:1px;align-items:center;justify-content:center;height:4px;margin-top:0}
.tile .hh{width:5px;height:5px;border-radius:1px;background:#22a55b;box-shadow:0 0 0 .5px rgba(0,0,0,.35)}
.tile .hh.hotel{width:12px;height:5px;border-radius:1.5px;background:#e02b3c}
.tile .mq{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 4px,rgba(0,0,0,0) 4px 8px);pointer-events:none}
.tile .jail-note{font-size:5.6px;color:#5c6f62;text-align:center;line-height:1}
.tile[data-kind="chance"] .nm,.tile[data-kind="chest"] .nm{font-size:calc(var(--tile-name)*.8);line-height:1.02;letter-spacing:-.2px}
.tile[data-kind="tax"] .nm{font-size:calc(var(--tile-name)*.88);line-height:1.02}
.tile.corner{background:linear-gradient(160deg,#f6f2e4,#e6dfc8);flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.tile.corner .ico{flex:0 0 auto;width:auto;height:22px;display:grid;place-items:center;overflow:hidden}
.tile.corner .ico svg{width:22px;height:22px;max-width:22px;overflow:hidden}
.tile.corner .nm{font-size:calc(var(--tile-name) * .9);letter-spacing:.1px;line-height:1.02}

/* center */
.center{
  grid-row:2 / span 9;grid-column:2 / span 9;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:clamp(8px,1.4vw,18px);
  background:
    radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),
    linear-gradient(150deg,#f3efe1,#e2dcc4);
  color:#17241c;overflow:hidden;
}
.center::before{content:"";position:absolute;inset:14px;border:1px solid rgba(40,70,50,.18);border-radius:10px;pointer-events:none}
.brandmark{display:flex;align-items:center;gap:8px;opacity:.85}
.brandmark .em{font-family:Georgia,serif;font-weight:700;letter-spacing:5px;font-size:clamp(10px,1.5vw,20px)}
.brandmark small{letter-spacing:2.4px;font-size:clamp(5.5px,.72vw,9px);color:#5f7563;text-transform:uppercase}
.dice-area{display:flex;gap:clamp(6px,1.2vw,16px);align-items:center;justify-content:center;perspective:600px}
.die{width:clamp(26px,4.4vw,52px);height:clamp(26px,4.4vw,52px);border-radius:12px;background:linear-gradient(160deg,#fffdf7,#e9e2cf);
  box-shadow:0 6px 14px rgba(20,40,30,.28),inset 0 0 0 1px rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.08);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;gap:2px;transition:transform .2s}
.die i{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a5750,#14201a);opacity:0;transform:scale(.7);transition:opacity .12s,transform .12s}
.die i.on{opacity:1;transform:scale(1)}
.die.roll1{animation:rollA .45s ease-out}
.die.roll2{animation:rollB .45s ease-out}
@keyframes rollA{0%{transform:rotate(0) translateY(0)}35%{transform:rotate(-28deg) translateY(-12px) scale(1.06)}70%{transform:rotate(14deg) translateY(2px)}100%{transform:rotate(0)}}
@keyframes rollB{0%{transform:rotate(0)}35%{transform:rotate(26deg) translateY(-14px) scale(1.06)}70%{transform:rotate(-12deg) translateY(2px)}100%{transform:rotate(0)}}
.dice-total{font-weight:900;font-size:clamp(11px,1.6vw,18px);color:#2c4033;min-height:1em}
.turnbox{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.turnbox .who{font-size:clamp(10px,1.5vw,17px);font-weight:900;display:flex;align-items:center;gap:7px}
.turnbox .who .pdot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.turnbox .status{font-size:clamp(7.5px,1.02vw,11.5px);color:#4a6054;max-width:34ch;line-height:1.35}
.center .ctas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:11px;
  font-weight:800;font-size:13px;letter-spacing:.2px;border:1px solid transparent;
  transition:.15s transform,.15s box-shadow,.15s filter;
}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#2fd47c,#1ea85e);color:#04220f;box-shadow:0 8px 18px rgba(47,212,124,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.gold{background:linear-gradient(180deg,#ffd580,#e6a726);color:#2a1a00;box-shadow:0 8px 18px rgba(230,167,38,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:rgba(255,255,255,.55);border-color:rgba(30,60,45,.25);color:#22372b}
.btn.danger{background:linear-gradient(180deg,#ef4b5a,#c22a39);color:#fff;box-shadow:0 8px 18px rgba(194,42,57,.3)}
.btn.sm{height:31px;padding:0 11px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.center-art{position:absolute;inset:6%;display:grid;place-items:center;pointer-events:none;z-index:0}
.center-art svg{width:min(78%,420px);height:auto;opacity:.9}
.center > *:not(.center-art){position:relative;z-index:1}
.center .mini-hint{font-size:clamp(6.5px,.86vw,9.5px);color:#6a7f72;letter-spacing:.3px}
.center-stats{display:flex;gap:clamp(5px,1vw,12px);flex-wrap:wrap;justify-content:center}
.center-stats .cs{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 9px;border-radius:9px;
  background:rgba(255,255,255,.5);border:1px solid rgba(30,60,45,.16);min-width:52px}
.center-stats .cs b{font-size:clamp(8px,1.1vw,12px);color:#1e3527;line-height:1.1}
.center-stats .cs small{font-size:clamp(5.5px,.68vw,8px);color:#61796b;letter-spacing:.5px;text-transform:uppercase}

/* pawns */
.pawns{position:absolute;inset:0;pointer-events:none;z-index:6}
.pawn{
  position:absolute;width:2.9%;height:2.9%;transform:translate(-50%,-88%);
  transition:left .14s linear,top .14s linear;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));
}
.pawn svg{width:100%;height:100%;display:block}
.pawn.active{animation:bob 1.1s ease-in-out infinite;z-index:9}
@keyframes bob{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-100%)}}
.pawn .tag{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:5.4px;font-weight:900;
  background:rgba(8,14,25,.82);color:#fff;padding:0 3px;border-radius:3px;white-space:nowrap}

/* zoom controls */
.zoom{display:flex;align-items:center;gap:6px;justify-content:center;margin:10px auto 0;flex-wrap:wrap}
.zoom button{width:32px;height:32px;border-radius:10px;background:rgba(12,20,34,.9);border:1px solid #3b557f;
  color:#dbe6ff;font-size:16px;font-weight:700;display:grid;place-items:center;transition:.15s background}
.zoom button:hover{background:#23375a}
.zoom .zlbl{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#7d90b3;font-weight:800;margin-right:2px}
.zoom .zhint{font-size:10.5px;color:#6b7f9f;margin-left:4px}
@media (max-width:1080px){.zoom .zhint{display:none}}

/* ---------------- SIDE PANELS ---------------- */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:linear-gradient(180deg,rgba(23,36,58,.95),rgba(15,25,42,.95));border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 10px 26px rgba(0,0,0,.28);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:800}
.card-h .grow{flex:1}
.players{padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:7px 8px;border-radius:11px;
  border:1px solid transparent;transition:.16s background}
.prow.now{background:rgba(53,208,127,.1);border-color:rgba(53,208,127,.34)}
.prow.dead{opacity:.42;filter:grayscale(1)}
.prow .av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#08111e}
.prow .nm{font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:5px;min-width:0}
.prow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .meta{font-size:10.5px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}
.prow .cash{font-weight:900;font-size:12.5px;text-align:right;white-space:nowrap}
.prow .cash small{display:block;font-size:9.5px;color:var(--muted);font-weight:600}
.badge{font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;padding:1px 5px;border-radius:99px;
  background:rgba(255,255,255,.1);color:#c6d3ea;font-weight:800}
.badge.bot{background:rgba(167,139,250,.18);color:#cbb9ff}
.badge.jail{background:rgba(239,75,90,.2);color:#ff9aa4}
.badge.you{background:rgba(53,208,127,.2);color:#8ff0ba}

.actions{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{height:36px;font-size:12.5px}
.log{padding:8px 10px 10px;max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:5px;scroll-behavior:smooth}
.log .li{font-size:11.5px;line-height:1.4;color:#b9c7de;padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.03);
  border-left:2px solid #2c4266}
.log .li.money{border-left-color:#35d07f;color:#c9f3da}
.log .li.good{border-left-color:#7ee787}
.log .li.warn{border-left-color:#f2c14e;color:#ffe6b0}
.log .li.bad{border-left-color:#ef4b5a;color:#ffc4c9}
.log .li.card{border-left-color:#a78bfa;color:#ded3ff}
.empty{color:var(--muted);font-size:12px;padding:10px;text-align:center}

/* ---------------- MODALS ---------------- */
.modal-root{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(4,8,14,.72);backdrop-filter:blur(6px)}
.modal-root.open{display:flex}
.modal{width:min(680px,100%);max-height:min(88vh,900px);overflow:auto;border-radius:20px;
  background:linear-gradient(180deg,#16233a,#0f1a2c);border:1px solid #2b4266;box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px;flex:1}
.modal-h .x{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:16px}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{position:relative;z-index:4;padding:14px 18px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(15,26,44,.6),rgba(15,26,44,.98))}
@media (max-width:520px){.modal-f .btn{flex:1}}
.lead{color:#c3d1e8;font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}
.divider{height:1px;background:var(--line)}
.tabs{display:flex;gap:6px;padding:4px;background:rgba(0,0,0,.24);border-radius:12px;width:fit-content}
.tab{padding:7px 13px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px #35507c}

/* buy card */
.buycard{position:relative;border-radius:16px;overflow:hidden;border:1px solid #2c4266;background:#0e1728}
.buycard .top{height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:2px;
  color:rgba(0,0,0,.62);font-size:12px;text-transform:uppercase}
.buycard .in{padding:14px 16px;display:grid;gap:8px}
.buycard .name{font-size:19px;font-weight:900}
.rent-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rent-table td{padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);color:#c3d1e8}
.rent-table td:last-child{text-align:right;font-weight:800;color:#fff}
.rent-table tr.hi td{color:var(--gold2)}

/* asset list */
.alist{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto;padding-right:2px}
.arow{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:8px 10px}
.arow .stripe{width:4px;height:30px;border-radius:3px}
.arow .t1{font-weight:800;font-size:12.8px;display:flex;align-items:center;gap:6px}
.arow .t2{font-size:10.8px;color:var(--muted)}
.arow .ops{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:9.5px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.09);color:#cfdbf0;font-weight:700}
.chip.mq{background:rgba(242,193,78,.16);color:#ffdf9a}
.chip.ht{background:rgba(239,75,90,.18);color:#ffb3ba}
.chip.hs{background:rgba(53,208,127,.16);color:#9df0c0}

/* trade */
.trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.trade-grid{grid-template-columns:1fr}}
.tcol{border:1px solid var(--line);border-radius:13px;padding:10px;background:rgba(255,255,255,.025);min-width:0}
.tcol h4{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.picklist{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow:auto}
.pick{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:8px;font-size:12px;cursor:pointer}
.pick:hover{background:rgba(255,255,255,.05)}
.pick input{accent-color:#35d07f}
.pick .sw{width:8px;height:8px;border-radius:2px;flex:none}
.money-in{display:flex;align-items:center;gap:6px;margin-top:8px}
.money-in input{width:100%;height:34px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid var(--line);
  color:#fff;padding:0 10px;font-weight:700;font-size:13px;outline:none}
.money-in input:focus{border-color:#4a6ea8}

/* setup */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
.field input,.field select{height:36px;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid var(--line);
  color:#fff;padding:0 10px;font-size:13px;outline:none;min-width:0}
.field input:focus,.field select:focus{border-color:#4a6ea8}
.prow-set{display:grid;grid-template-columns:24px 1fr 104px 108px 26px;gap:7px;align-items:center;margin-bottom:7px}
@media (max-width:520px){.prow-set{grid-template-columns:22px 1fr 92px;grid-template-areas:"c n t" ". p x"}}
.prow-set .idx{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#08111e}
.prow-set input,.prow-set select{height:32px;border-radius:8px;background:rgba(0,0,0,.32);border:1px solid var(--line);color:#fff;padding:0 8px;font-size:12px;min-width:0}
.rm{width:26px;height:26px;border-radius:8px;background:rgba(239,75,90,.16);color:#ff9aa4;font-weight:900;display:grid;place-items:center}
.saved-card{border:1px solid rgba(242,193,78,.4);background:rgba(242,193,78,.08);border-radius:14px;padding:12px 14px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.saved-card .txt{flex:1;min-width:180px}
.saved-card b{display:block;font-size:13.5px}
.saved-card small{color:#e2cd9a;font-size:11.5px}

/* auction */
.auc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.auc-big{font-size:30px;font-weight:900;color:var(--gold2);line-height:1}
.auc-who{font-size:12.5px;color:#c3d1e8}
.bidrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bidrow input{height:38px;width:130px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;padding:0 10px;font-weight:800;outline:none}

/* winner */
.winner-hero{text-align:center;padding:8px 0 4px}
.winner-hero .cup{font-size:46px;line-height:1}
.winner-hero h2{font-size:24px;margin-top:4px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .r{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:12.5px}
.rank .r.first{background:rgba(242,193,78,.14);border:1px solid rgba(242,193,78,.35)}

/* toast */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(14,23,40,.96);border:1px solid #33507d;color:#e8f0ff;padding:9px 15px;border-radius:11px;
  font-size:12.5px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .2s ease-out}
.toast.good{border-color:#2f9e63;background:rgba(16,44,30,.96);color:#c9f7dc}
.toast.bad{border-color:#a63846;background:rgba(46,18,24,.96);color:#ffc9cf}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* card flip */
.flip{perspective:1000px;position:relative;height:200px}
.flip .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,1.4,.5,1)}
.flip.show .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:18px;text-align:center}
.flip .front{background:linear-gradient(145deg,#1c2f4f,#0d1728);border:1px solid #2f4a74}
.flip .back{background:linear-gradient(145deg,#f6efdc,#e6d9b8);color:#22301f;transform:rotateY(180deg);border:1px solid #c9b98d}
.flip .back h4{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#7a6533;margin-bottom:8px}
.flip .back p{font-size:15px;font-weight:700;line-height:1.4;margin:0}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-5vh;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* misc */
.mobile-only{display:none}
@media (max-width:1080px){
  .mobile-only{display:flex}
  .log{max-height:180px}
  .tbtn .lbl{display:none}
}
@media (max-width:760px){
  .topbar{padding:8px 10px;gap:7px}
  .brand .logo{width:30px;height:30px}
  .brand b{font-size:12px;letter-spacing:0;white-space:nowrap}
  .brand small{display:none}
  .brand{gap:7px;min-width:0;overflow:hidden}

  .turn-chip{font-size:11px;padding:5px 9px}
  .turn-chip .dot{width:7px;height:7px}
  .tbtn{height:32px;padding:0 9px;font-size:12px}
  .tbtn.icon{width:34px}
  /* papan tetap utuh di layar; tombol + / − memperbesar & menggeser */
  .board-wrap{overflow:hidden}
  .board.compact .pr{display:none}
  .board.compact .nm{font-size:6.1px;line-height:1.02;letter-spacing:-.3px;overflow-wrap:anywhere}
  .board.compact .tile .body{padding:0 0 1px;gap:0}
  .board.compact .tile:not(.corner) .ico{height:10px}
  .board.compact .tile:not(.corner) .ico svg{width:10px;height:10px}
  .board.compact .tile .band{height:12%;min-height:5px}
  .board-frame{padding:9px;border-radius:16px}
  .center{padding:8px;gap:6px}
  .center-stats .cs{padding:2px 6px;min-width:44px}
  .zoom{margin-top:8px}
}
@media (max-width:560px){.brand b,.brand small{display:none}.brand{flex:0 0 auto}.topbar{gap:6px}}
@media (max-width:420px){.turn-chip{font-size:10px;padding:4px 7px;gap:5px}.tbtn{height:30px;padding:0 7px}.tbtn.icon{width:30px}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3f60;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 21V9.5L12 3l9 6.5V21h-6v-6H9v6H3Z" fill="#f2c14e" stroke="#0b1220" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <div><b>PROPERTY EMPIRE</b><small>UMI Games</small></div>
  </div>
  <div class="spacer"></div>
  <div class="turn-chip" id="turnChip"><span class="dot"></span><span id="turnChipText">Siap bermain</span></div>
  <button class="tbtn icon" id="btnSound" title="Suara" aria-label="Suara">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button class="tbtn" id="btnSettings" title="Pengaturan">⚙ <span class="lbl">Setelan</span></button>
  <button class="tbtn" id="btnTutorial" title="Tutorial">? <span class="lbl">Tutorial</span></button>
  <a class="tbtn" href="/" title="Main multiplayer online" style="text-decoration:none">🌐 <span class="lbl">Online</span></a>
  <button class="tbtn" id="btnRestart" title="Mulai ulang">⟳ <span class="lbl">Ulang</span></button>
</header>

<main class="layout">
  <section class="board-col">
    <div class="board-frame">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board">
          <div class="tiles" id="tiles" style="display:contents"></div>
          <div class="center" id="center">
            <div class="center-art" aria-hidden="true">
              <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="none" stroke="#2f4a38" stroke-opacity=".13" stroke-width="2"/>
                <circle cx="100" cy="100" r="74" fill="none" stroke="#2f4a38" stroke-opacity=".1" stroke-width="1.4"/>
                <circle cx="100" cy="100" r="52" fill="none" stroke="#2f4a38" stroke-opacity=".08" stroke-width="1.2"/>
                <path d="M68 132V92l32-24 32 24v40h-20v-24H88v24H68Z" fill="#2f4a38" fill-opacity=".07"/>
              </svg>
            </div>
            <div class="brandmark">
              <span class="em">PROPERTY</span><small>empire</small>
            </div>
            <div class="dice-area" id="diceArea">
              <div class="die" id="die1"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="die" id="die2"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="dice-total" id="diceTotal"></div>
            <div class="turnbox">
              <div class="who" id="turnWho"></div>
              <div class="status" id="turnStatus">Pilih “Mulai Permainan” untuk membuka papan.</div>
            </div>
            <div class="ctas" id="centerCtas">
              <button class="btn primary" id="btnRoll">🎲 Lempar Dadu</button>
              <button class="btn ghost" id="btnEnd">Akhiri Giliran</button>
            </div>
            <div class="center-stats" id="centerStats"></div>
            <div class="mini-hint" id="miniHint">Dua dadu · kembar = lempar lagi · 3× kembar = penjara</div>
          </div>
          <div class="pawns" id="pawns"></div>
        </div>
      </div>
    </div>
    <div class="zoom">
      <span class="zlbl">Papan</span>
      <button id="zOut" title="Perkecil" aria-label="Perkecil">−</button>
      <button id="zReset" title="Pas layar" aria-label="Pas layar" style="font-size:12px">⤢</button>
      <button id="zIn" title="Perbesar" aria-label="Perbesar">+</button>
      <span class="zhint">geser papan untuk melihat sudut lain</span>
    </div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="card-h">Pemain <span class="grow"></span><span id="turnCount"></span></div>
      <div class="players" id="players"></div>
    </div>
    <div class="card">
      <div class="card-h">Aksi</div>
      <div class="actions">
        <button class="btn ghost sm" id="btnManage">🏗 Kelola</button>
        <button class="btn ghost sm" id="btnTrade">🤝 Tukar</button>
        <button class="btn ghost sm" id="btnDetail">🔎 Detail Petak</button>
        <button class="btn ghost sm" id="btnStats">📊 Statistik</button>
      </div>
    </div>
    <div class="card">
      <div class="card-h">Catatan Permainan <span class="grow"></span><span id="logCount"></span></div>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>

<div class="modal-root" id="modalRoot"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<div class="confetti" id="confetti"></div>

<script type="module" src="/empire/ui.js"></script>
</body>
</html>
