# ============================================================================
# Reverse proxy HTTPS untuk Usanagi Umi Bot API
#
# Ini jembatan antara website di Vercel dan bot di VPS/Pterodactyl.
# Website HANYA boleh menunjuk ke origin HTTPS seperti:
#     https://api.domainmu.com
# Bukan IP:port mentah, bukan URL panel Pterodactyl.
#
# Pasang:
#   1. sudo cp deploy/nginx/umi-bot-api.conf /etc/nginx/sites-available/umi-bot-api
#   2. Ganti api.domainmu.com dan port 3854 sesuai config.js milikmu
#   3. sudo ln -s /etc/nginx/sites-available/umi-bot-api /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d api.domainmu.com
#   5. sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Batasi percobaan berlebihan pada endpoint API bot.
limit_req_zone $binary_remote_addr zone=umi_api:10m rate=30r/s;

upstream umi_bot_api {
    # Port harus sama dengan global.jadibotPlatform.apiPort di bot/config.js
    # Default kode 2144, contoh config 3854. Bot tetap listen di 0.0.0.0,
    # jadi firewall wajib menutup port ini dari publik.
    server 127.0.0.1:3854;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.domainmu.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.domainmu.com;

    ssl_certificate     /etc/letsencrypt/live/api.domainmu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domainmu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Jangan bocorkan versi nginx.
    server_tokens off;

    # Payload unggahan plugin/media dibatasi; sesuaikan bila perlu.
    client_max_body_size 64m;
    client_body_timeout  60s;

    # ------------------------------------------------------------------
    # Health check. Ini yang dicek website lewat GET /api/health.
    # Wajib mengembalikan JSON berisi "ok": true.
    # ------------------------------------------------------------------
    location = /api/health {
        access_log off;
        proxy_pass http://umi_bot_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ------------------------------------------------------------------
    # API bot. Semua endpoint lain tetap butuh token Bearer Supabase
    # yang divalidasi bot — proxy tidak menambahkan kepercayaan apa pun.
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=umi_api burst=60 nodelay;

        proxy_pass http://umi_bot_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Jangan pernah cache respons API privat.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Blokir sisanya: bot API tidak punya halaman publik.
    location / {
        return 404;
    }
}

# Diperlukan untuk header Connection pada proxy_set_header di atas.
# Kalau server ini sudah punya variabel $connection_upgrade di site config lain,
# HAPUS blok map di bawah (jangan didefinisikan dua kali, nginx akan menolak).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
